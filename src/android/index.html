    <title>VioletWire Android</title>
    <style>
      html,body { margin:0; background:#000000; }

      #android-startup button { border:0; border-radius:8px; padding:12px 24px; color:#fff; background:#9147ff; font:inherit; }

      @media(prefers-reduced-motion:reduce) { #android-startup { transition-duration:100ms; } }
    </style>

    <div id="android-startup" role="status" aria-label="Loading VioletWire Android">
